<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" fill="none">
  <!-- The navbar logo (bottle with the name inside), on a dark tile so it
       reads on light and dark browser tabs. Strokes and text are heavier
       than in the navbar: this is drawn at 16-32 px. -->
  <rect width="320" height="320" rx="64" fill="#0B0F14"/>
  <g transform="translate(8 96)">
    <rect x="286" y="44" width="22" height="32" rx="3" fill="#C9A961"/>
    <path d="M258 48 H288 V72 H258 Z" stroke="#EDE8DF" stroke-width="7" stroke-linejoin="round"/>
    <path d="M258 48 C240 28 222 16 200 16 H32 C14 16 4 26 4 44 V76 C4 94 14 104 32 104 H200 C222 104 240 92 258 72" stroke="#EDE8DF" stroke-width="7" stroke-linejoin="round"/>
    <!-- Favicons can't load web fonts: textLength keeps the name inside the
         bottle whichever serif the browser falls back to. -->
    <text x="130" y="76" text-anchor="middle" textLength="200" lengthAdjust="spacingAndGlyphs" font-family="'Cormorant Garamond', Georgia, serif" font-weight="600" font-size="54" fill="#EDE8DF">Lahist'air</text>
  </g>
</svg>
